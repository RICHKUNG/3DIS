# Production-like test configuration (matches base.yaml workflow behavior)
# Only difference: limited scene range for faster testing

experiment:
  name: test_1105_ssam4_filter300_fill500_fix
  dataset_root: /media/public_dataset2/multiscan
  scenes: null
  scene_start: scene_00005_00  # Test with small scene range
  scene_end: scene_00006_01    # 4 scenes for testing
  parallel_scenes: 2
  force_parallel: true  # Match base.yaml: bypass OOM monitoring
  levels:
    - 2
    - 4
    - 6
  tag: tag
  tag_in_path: false
  aggregate_output: false
  output_layout: scene_level
  output_root: /media/Pluto/richkung/My3DIS/outputs/experiments/{name}
  frames:
    step: 50

stages:
  gpu: 1
  ssam:
    enabled: true
    ssam_freq: 4
    min_area: 300
    stability_threshold: null  # Don't use stability filtering at SSAM stage (Phase 2.2)
    persist_raw: true
    skip_filtering: true
    add_gaps: true
    fill_area: 500  # Match base.yaml: 5k instead of 10k
    append_timestamp: false
    downscale_masks: true
    downscale_ratio: 0.3  # Match base.yaml: full resolution
    max_masks_per_level: 5000  # Limit for testing
    cascade_filtering: true  # Enable cascade filtering (Phase 2.2)
    sam_ckpt: /media/Pluto/Yenhongxuan/Semantic-SAM/ckpts/swinl_only_sam_many2many.pth
  filter:
    enabled: true
    min_area: 300
    stability_threshold: 1.0  # Post-SSAM filtering (not currently used)
  tracker:
    enabled: true
    prompt_mode: all_mask
    max_propagate: 30
    iou_threshold: 0.6
    downscale_masks: true
    downscale_ratio: 0.3  # Match base.yaml: full resolution
    render_viz: true
    sam2_cfg: /media/Pluto/Yenhongxuan/Grounded-SAM-2/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    sam2_ckpt: /media/Pluto/Yenhongxuan/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt
    comparison_sampling:
      max_frames: 300
    # ========================================================================
    # Family Tree Building & Visualization Configuration
    # ========================================================================
    visualize_families: true         # Enable for test runs to verify output
    family_viz:
      num_families: 200                # Fewer families for faster testing
      max_frames_per_family: 2       # Fewer frames per family
      output_subdir: visualizations
      random_seed: 42
      min_levels: 2
    # ========================================================================
  report:
    enabled: true
    name: report.md
    max_width: 640
    record_timings: true
    timing_output: stage_timings.json
    generate_check_report: true

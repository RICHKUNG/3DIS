# Full Pipeline Configuration with RELAXED Pairing Constraints
# This config addresses the "0 valid pairs" issue by:
# 1. Lowering containment threshold from 0.1 to 0.01
# 2. Expanding scale range to allow parts larger than objects
# 3. Relying on semantic similarity and NMS for quality control
#
# Based on: full_pipeline.yaml
# Changes: Pairing constraints significantly relaxed

# ============================================================================
# Experiment Settings
# ============================================================================
experiment:
  exp_dir: /media/Pluto/richkung/My3DIS/outputs/experiments/test_1108_ssam4_filter500_fill500_propinf/scene_00005_00
  levels: [2, 4, 6]
  scene_path: /media/public_dataset2/multiscan/scene_00005_00
  aggregation_output_dir: null
  inference_output_dir: null
  device: cuda:0

# ============================================================================
# Aggregation Stage Configuration
# ============================================================================
aggregation:
  enabled: false  # Skip aggregation if already done
  iou_threshold: 0.8
  area_fraction: 0.002
  area_fraction_per_level: null
  extract_features: true
  siglip_model: google/siglip-so400m-patch14-384
  pooling_mode: voting
  projection:
    vis_depth_threshold: 0.1
    frequency: 50
    resize_ratio: 0.3
    depth_scale: 1000.0

# ============================================================================
# Inference Stage Configuration (MODIFIED)
# ============================================================================
inference:
  enabled: true
  export_predictions_ply: true
  ply_export_max_predictions: 50
  ply_export_include_full_scene: true
  ply_export_background_color: [80, 80, 80]
  ply_export_colors:
    - [255, 99, 71]
    - [102, 205, 170]
    - [65, 105, 225]
    - [218, 112, 214]
    - [255, 215, 0]
    - [0, 191, 255]
    - [144, 238, 144]
    - [255, 140, 0]

  test_all_strategies: true
  strategies_to_test: [independent, hierarchical]
  strategy: independent

  retrieval:
    temperature: 0.2
    min_similarity: 0.05
    top_k_per_level: 100
    object_levels: [L2, L4]
    part_levels: [L4, L6]

  # ==================== MODIFIED PAIRING CONFIG ====================
  # KEY CHANGES:
  # - containment_threshold: 0.1 → 0.01 (allow minimal overlap)
  # - scale_range: [0.001, 0.99] → [0.0001, 5.0] (allow part > object)
  pairing:
    containment_threshold: 0.01    # RELAXED: Only require 1% overlap
    scale_range: [0.0001, 5.0]     # RELAXED: Allow part up to 5x object size
    use_geometric_score: true      # Keep enabled for scoring
    use_tree_pruning: false        # Keep disabled for maximum recall
  # ================================================================

  nms:
    iou_threshold: 0.35            # Keep tight to filter duplicates
    use_soft_nms: false
    soft_nms_sigma: 0.5
    centroid_distance_ratio: 0.2
    keep_top_k: 200                # May want to reduce if too many predictions

  scoring:
    method: weighted_sum
    weights:
      object: 0.4
      part: 0.4
      geometric: 0.2
    temperature: 1.0
    hierarchy_bonus: 0.05

  formatter:
    use_part_mask: true
    min_mask_size: 10

  independent:
    object_levels: [L2, L4]
    part_levels: [L4, L6]
    top_k_per_level: 100
    retrieval_threshold: 0.2
    min_retrieval_threshold: 0.01
    threshold_backoff_step: 0.03
    fallback_to_topk: true

  hierarchical:
    coarse_top_k: 150
    object_top_k: 100
    part_top_k: 50
    coarse_threshold: 0.05
    refinement_threshold: 0.1
    refinement_margin: 0.05

# ============================================================================
# Evaluation Stage Configuration
# ============================================================================
evaluation:
  enabled: true
  gt_paths:
    obj_part: /media/Pluto/richkung/My3DIS/data/search3d_gt/multiscan_data_search3d/multiscan_annotations_search3d/ov_part_annotations
  eval_modes: ['obj_part']
  eval_scripts:
    obj_part: eval/search3d/eval_semantic_instance_parts_OV.py
  gt_path: null
  query_file: /media/Pluto/richkung/My3DIS/eval/search3d/eval_semantic_instance_parts_OV.py
  dataset_root: /media/public_dataset2/multiscan
  scenes: null
  num_workers: 4
  save_per_scene_metrics: true
  save_per_class_metrics: true

# ============================================================================
# Logging and Debugging
# ============================================================================
logging:
  level: INFO
  save_logs: true
  log_file: pipeline.log
